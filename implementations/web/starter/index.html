<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Liquid Glass Starter</title>
<link rel="icon" href="data:,">
<!--
  Liquid Glass Starter — the house pattern for NEW UIs (liquid-glass-ui skill).
  1. One drawable scene layer (<canvas> / <img> / <video>) marked data-lg-backdrop-source.
  2. Floating chrome marked data-lg-glass (+ .lg-glass for the v1 fallback look).
  3. LGRefraction.autoAttach() gives every glass surface the SIGNATURE bend; shape comes from border-radius.
  Replace drawScene() with your own art, or swap the canvas for <img data-lg-backdrop-source src="…">.
-->
<!-- build:css -->
<link rel="stylesheet" href="../src/tokens.css">
<link rel="stylesheet" href="../src/liquid-glass.css">
<!-- /build:css -->
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #fff; overflow: hidden; background: #1a1240; }
  #scene { position: fixed; inset: 0; width: 100vw; height: 100vh; }
  .app { position: relative; height: 100vh; display: grid; grid-template-rows: auto 1fr auto; padding: 18px clamp(14px, 4vw, 40px) 22px; gap: 16px; }
  /* glass chrome */
  .nav { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 8px 8px 20px; border-radius: 999px; color: #0b0b0f; }
  .brand { font-weight: 800; letter-spacing: -0.02em; font-size: 17px; }
  .links { display: flex; gap: 4px; }
  .links a { color: inherit; text-decoration: none; font-weight: 600; padding: 10px 14px; border-radius: 999px; }
  .links a[aria-current] { background: rgba(255,255,255,.45); }
  .hero { align-self: center; max-width: 620px; }
  .hero h1 { font-size: clamp(34px, 6vw, 60px); line-height: 1.02; letter-spacing: -0.03em; margin: 0 0 12px; text-shadow: 0 2px 18px rgba(0,0,0,.25); }
  .hero p { font-size: 18px; margin: 0 0 22px; max-width: 46ch; text-shadow: 0 1px 10px rgba(0,0,0,.3); }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .btn { display: inline-flex; align-items: center; gap: 8px; min-height: 52px; padding: 0 26px; border: 0; border-radius: 999px; font: 700 16px system-ui, sans-serif; color: #0b0b0f; cursor: pointer; }
  .fab { width: 64px; height: 64px; border-radius: 50%; border: 0; display: grid; place-items: center; color: #0b0b0f; cursor: pointer; }
  .fab svg, .tab svg { width: 24px; height: 24px; }
  .search { display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 0 20px; border-radius: 999px; width: min(360px, 100%); color: #0b0b0f; }
  .search input { flex: 1; border: 0; background: transparent; font: 600 16px system-ui, sans-serif; color: inherit; outline: none; }
  .panel { position: absolute; right: clamp(14px, 4vw, 40px); top: 96px; width: 300px; padding: 20px; border-radius: 30px; color: #0b0b0f; }
  .panel h2 { margin: 0 0 10px; font-size: 18px; }
  .setting { display: flex; align-items: center; justify-content: space-between; min-height: 46px; font-weight: 600; }
  .tabbar-wrap { justify-self: center; }
  .tabbar { display: flex; gap: 2px; padding: 6px; border-radius: 999px; color: #0b0b0f; }
  .tab { display: grid; justify-items: center; gap: 2px; min-width: 74px; padding: 8px 10px; border: 0; background: transparent; border-radius: 999px; font: 600 11px system-ui, sans-serif; color: inherit; cursor: pointer; }
  .tab[aria-selected="true"] { background: rgba(255,255,255,.5); }
  @media (max-width: 760px) { .panel { display: none; } .links { display: none; } }
</style>
</head>
<body>
<canvas id="scene" data-lg-backdrop-source aria-hidden="true"></canvas>

<div class="app">
  <header class="nav lg-glass" data-lg-glass data-lg-preset="control">
    <span class="brand">Lumen</span>
    <nav class="links" aria-label="Primary"><a href="#" aria-current="page">Home</a><a href="#">Work</a><a href="#">About</a></nav>
    <button class="fab" style="width:44px;height:44px;background:transparent" aria-label="Menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
  </header>

  <main class="hero">
    <h1>Light that bends around your interface.</h1>
    <p>Starter layout for the liquid-glass-ui skill: every floating control uses the signature glass.</p>
    <div class="row">
      <button class="btn lg-glass" data-lg-glass data-lg-preset="control" data-lg-interactive>Get started</button>
      <label class="search lg-glass" data-lg-glass data-lg-preset="control">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg>
        <input type="search" placeholder="Search" aria-label="Search">
      </label>
      <button class="fab lg-glass" data-lg-glass data-lg-interactive aria-label="Play">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5l12 7-12 7z"/></svg>
      </button>
    </div>
  </main>

  <aside class="panel lg-glass" data-lg-glass data-lg-preset="overlay" aria-label="Quick settings">
    <h2>Quick settings</h2>
    <div class="setting"><span id="s1">Focus mode</span><button class="lg-toggle" role="switch" aria-checked="true" aria-labelledby="s1"><span class="lg-toggle__knob"></span></button></div>
    <div class="setting"><span id="s2">Night shift</span><button class="lg-toggle" role="switch" aria-checked="false" aria-labelledby="s2"><span class="lg-toggle__knob"></span></button></div>
  </aside>

  <nav class="tabbar-wrap" aria-label="Sections"><div class="tabbar lg-glass" data-lg-glass data-lg-preset="control" role="tablist" aria-label="Sections">
    <button class="tab" role="tab" aria-selected="true"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3l9 8h-3v9h-5v-6h-2v6H6v-9H3z"/></svg>Home</button>
    <button class="tab" role="tab" aria-selected="false"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"/></svg>Browse</button>
    <button class="tab" role="tab" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 5-6 8-6s7 2 8 6"/></svg>Profile</button>
  </div></nav>
</div>

<!-- build:js -->
<script type="module">
  import LG from '../src/liquid-glass.js';
  import LGRefraction from '../src/liquid-glass-refraction.js';
  window.__STARTER_READY__ = (async () => {
    const canvas = document.getElementById('scene');
    // ---- your scene: replace with your own art / photo. It must be drawable (canvas, img or video). ----
    function drawScene() {
      const dpr = Math.min(devicePixelRatio || 1, 2), w = innerWidth, h = innerHeight;
      canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
      const c = canvas.getContext('2d'); c.setTransform(dpr, 0, 0, dpr, 0, 0);
      const g = c.createLinearGradient(0, 0, w, h);
      g.addColorStop(0, '#ff7a45'); g.addColorStop(0.45, '#ff3d7f'); g.addColorStop(0.75, '#7b3cff'); g.addColorStop(1, '#16206b');
      c.fillStyle = g; c.fillRect(0, 0, w, h);
      const blob = (x, y, r, col) => { const q = c.createRadialGradient(x, y, 0, x, y, r); q.addColorStop(0, col); q.addColorStop(1, 'rgba(0,0,0,0)'); c.fillStyle = q; c.fillRect(x - r, y - r, r * 2, r * 2); };
      blob(w * 0.82, h * 0.22, Math.max(w, h) * 0.28, 'rgba(255,224,102,0.95)');
      blob(w * 0.12, h * 0.85, Math.max(w, h) * 0.35, 'rgba(36,214,255,0.8)');
      c.strokeStyle = 'rgba(255,255,255,0.35)'; c.lineWidth = 2;                       // fine detail so the bend is visible
      for (let x = -h; x < w; x += 46) { c.beginPath(); c.moveTo(x, h); c.lineTo(x + h, 0); c.stroke(); }
      c.fillStyle = '#fff3'; c.font = '800 160px system-ui, sans-serif'; c.fillText('LUMEN', w * 0.04, h * 0.42);
      LGRefraction.invalidate(canvas);
    }
    drawScene();
    addEventListener('resize', drawScene);
    LG.init();                                   // v1 behaviours: press flex, toggles, audit, fallback look
    LGRefraction.autoAttach(document);           // v2 signature refraction on every [data-lg-glass]
    document.querySelectorAll('.tab').forEach((t) => t.addEventListener('click', () => document.querySelectorAll('.tab').forEach((x) => x.setAttribute('aria-selected', String(x === t)))));
    return true;
  })();
</script>
<!-- /build:js -->
</body>
</html>
