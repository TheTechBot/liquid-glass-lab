<script>
(function(){

 * Liquid Glass Lab — web behaviour layer (APPROXIMATION, not Apple's renderer).
 * No dependencies. ES module + window.LG global.
 *
 *  LG.init(root?)              wire all [data-lg-*] behaviour under root
 *  LG.refract(el, size?)       attach SVG displacement refraction (Chromium only)
 *  LG.morphIndicator(group)    move shared .lg-pill to selected item (FLIP-style)
 *  LG.openMenu(trigger, menu)  grow menu from trigger, trigger dematerializes
 *  LG.closeMenu(menu)
 *  LG.materialize(el) / LG.dematerialize(el)

 *  LG.audit(root?)             budget + rule checks, returns report object

const SVG_NS = 'http://www.w3.org/2000/svg';
// keep in sync with design-system/tokens/tokens.json -> refraction

// ---------- displacement map ----------
// Rounded-rect signed distance field -> edge-normal displacement. R = x offset, G = y offset, 128 = none.
// Inside a band of width `edge*min(w,h)` from the border, pixels sample *inward* with a quadratic falloff,
// which reads as a convex lens rim. Shape constants are our estimate, not Apple's lens function.
function displacementMap(w, h, r, edgeFrac) {
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(w));
  c.height = Math.max(1, Math.round(h));
  const ctx = c.getContext('2d');

  for (let y = 0; y < c.height; y++) {
    for (let x = 0; x < c.width; x++) {
      const sx = Math.sign(x + 0.5 - cx) || 1, sy = Math.sign(y + 0.5 - cy) || 1;
      const px = Math.abs(x + 0.5 - cx) - (cx - rr);
      const py = Math.abs(y + 0.5 - cy) - (cy - rr);
      const qx = Math.max(px, 0), qy = Math.max(py, 0);
      const outside = Math.hypot(qx, qy);
      const sdf = outside + Math.min(Math.max(px, py), 0) - rr; // <0 inside
      let nx = 0, ny = 0;
      if (outside > 0) { nx = (qx / outside) * sx; ny = (qy / outside) * sy; }
      else if (px > py) nx = sx; else ny = sy;
      const depth = -sdf;
      let m = 0;
      if (depth >= 0 && depth < band) { const t = 1 - depth / band; m = t * t; }
      const i = (y * c.width + x) * 4;
      d[i] = 128 - nx * m * 127;
      d[i + 1] = 128 - ny * m * 127;
      d[i + 2] = 128;
      d[i + 3] = 255;

// ---------- morphing indicator (segmented control / tab bar) ----------

}

function wireSegmented(group) {
  if (group.__lgWired) return;

    b.addEventListener('click', () => select(b));
    b.addEventListener('keydown', (e) => {

// ---------- materialize ----------
function materialize(el) {

    [{ opacity: 0, transform: 'scale(0.94)', filter: 'blur(4px)' }, { opacity: 1, transform: 'scale(1)', filter: 'blur(0px)' }],

  menu.style.top = `${Math.max(8, top)}px`;

// ---------- slider ----------
function wireSlider(sl) {
  if (sl.__lgWired) return;
  sl.__lgWired = true;
  const knob = sl.querySelector('.lg-slider__knob');
  const fill = sl.querySelector('.lg-slider__fill');
  const min = +(sl.getAttribute('aria-valuemin') ?? 0), max = +(sl.getAttribute('aria-valuemax') ?? 100);
  const set = (v) => {

    sl.setPointerCapture(e.pointerId);

    const v = +sl.getAttribute('aria-valuenow');
    const step = e.shiftKey ? 10 : 1;
    if (e.key === 'ArrowRight' || e.key === 'ArrowUp') { e.preventDefault(); set(v + step); }
    if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') { e.preventDefault(); set(v - step); }
    if (e.key === 'Home') { e.preventDefault(); set(min); }
    if (e.key === 'End') { e.preventDefault(); set(max); }
  });

}

// ---------- toggle ----------
function wireToggle(t) {
  if (t.__lgWired) return;
  t.__lgWired = true;
  t.addEventListener('pointerdown', () => t.classList.add('is-pressed'));
  const up = () => t.classList.remove('is-pressed');
  t.addEventListener('pointerup', up); t.addEventListener('pointerleave', up);
  t.addEventListener('click', () => {
    const on = t.getAttribute('aria-checked') !== 'true';
    t.setAttribute('aria-checked', String(on));
    t.dispatchEvent(new CustomEvent('lg-change', { detail: { value: on }, bubbles: true }));
  });

// ---------- tab bar minimize on scroll (E-01 tabBarMinimizeBehavior analogue) ----------
function wireMinimize(bar) {
  if (bar.__lgWired) return;
  bar.__lgWired = true;
  const sel = bar.getAttribute('data-lg-minimize-on');
  const scroller = sel ? document.querySelector(sel) : window;
  let last = 0;
  const pos = () => (scroller === window ? window.scrollY : scroller.scrollTop);
  scroller.addEventListener('scroll', () => {
    const y = pos();
    if (Math.abs(y - last) < 6) return;
    bar.classList.toggle('is-minimized', y > last && y > 40);
    last = y;
  }, { passive: true });
}

// ---------- audit ----------
function audit(root = document) {
  // visible = rendered, not morph-hidden, and not clipped out by any scrolling/clipping ancestor
  const vis = (el) => {
    if (el.closest('[hidden]') || el.classList.contains('lg-morph-hidden')) return false;
    const r = el.getBoundingClientRect();
    if (!r.width || !r.height) return false;
    for (let p = el.parentElement; p; p = p.parentElement) {
      if (/(auto|scroll|hidden|clip)/.test(getComputedStyle(p).overflowY)) {
        const pr = p.getBoundingClientRect();
        if (r.bottom <= pr.top || r.top >= pr.bottom) return false;
      }

    return r.bottom > 0 && r.top < innerHeight;
  };
  const glass = [...root.querySelectorAll('.lg-glass')].filter(vis);
  const refracting = glass.filter((g) => g.hasAttribute('data-lg-refract'));
  const nested = glass.filter((g) => g.parentElement && g.parentElement.closest('.lg-glass'));
  const contentLayer = glass.filter((g) => { const l = g.closest('[data-lg-layer]'); return l && l.getAttribute('data-lg-layer') === 'content'; });
  const unlabeled = [...root.querySelectorAll('.lg-btn--icon')].filter((b) => !(b.getAttribute('aria-label') || b.getAttribute('aria-labelledby') || b.textContent.trim()));
  const mixed = [...root.querySelectorAll('.lg-group,[data-lg-container]')].filter((c) => {
    const kids = c.querySelectorAll('.lg-glass');
    const clear = [...kids].filter((k) => k.classList.contains('lg-glass--clear')).length;
    return clear > 0 && clear < kids.length;
  });
  // glass-on-glass also happens without DOM nesting: two glass rects overlapping on screen
  const overlaps = [];
  for (let i = 0; i < glass.length; i++) for (let j = i + 1; j < glass.length; j++) {
    const a = glass[i].getBoundingClientRect(), b = glass[j].getBoundingClientRect();
    const ix = Math.min(a.right, b.right) - Math.max(a.left, b.left), iy = Math.min(a.bottom, b.bottom) - Math.max(a.top, b.top);
    if (ix > 2 && iy > 2 && !glass[i].contains(glass[j]) && !glass[j].contains(glass[i])) overlaps.push([glass[i], glass[j]]);
  }
  const issues = [];
  if (glass.length > BUDGET.glass) issues.push(`budget: ${glass.length} glass surfaces visible (max ${BUDGET.glass})`);
  if (refracting.length > BUDGET.refract) issues.push(`budget: ${refracting.length} refracting surfaces visible (max ${BUDGET.refract})`);
  nested.forEach((n) => issues.push(`glass-on-glass: ${describe(n)}`));
  overlaps.forEach(([a, b]) => issues.push(`overlapping glass: ${describe(a)} / ${describe(b)}`));
  contentLayer.forEach((n) => issues.push(`glass in content layer: ${describe(n)}`));
  unlabeled.forEach((n) => issues.push(`icon button without accessible name: ${describe(n)}`));
  mixed.forEach((n) => issues.push(`regular and clear mixed in one group: ${describe(n)}`));
  return { visibleGlass: glass.length, refracting: refracting.length, issues };
}
function describe(el) { return el.id ? `#${el.id}` : `${el.tagName.toLowerCase()}.${[...el.classList].join('.')}`; }

// ---------- init ----------
function init(root = document) {
  const html = document.documentElement;
  html.classList.toggle('lg-refract-on', refractionAllowed());
  root.querySelectorAll('[data-lg-interactive]').forEach(wireInteractive);
  root.querySelectorAll('.lg-segmented').forEach(wireSegmented);
  root.querySelectorAll('.lg-slider').forEach(wireSlider);
  root.querySelectorAll('.lg-toggle').forEach(wireToggle);
  root.querySelectorAll('[data-lg-minimize-on]').forEach(wireMinimize);
  if (refractionAllowed()) root.querySelectorAll('.lg-glass[data-lg-refract-auto]').forEach((el) => refract(el));
  root.querySelectorAll('[data-lg-menu-trigger]').forEach((t) => {
    if (t.__lgMenu) return;
    t.__lgMenu = true;
    const menu = document.getElementById(t.getAttribute('data-lg-menu-trigger'));
    t.setAttribute('aria-haspopup', 'menu');
    t.setAttribute('aria-expanded', 'false');
    t.setAttribute('aria-controls', menu.id);
    t.addEventListener('click', () => (menu.hidden ? openMenu(t, menu) : closeMenu(menu)));
    menu.addEventListener('click', (e) => { if (e.target.closest('[role="menuitem"]')) closeMenu(menu); });
  });
  const r = audit(root);
  if (r.issues.length) console.warn('[liquid-glass] audit', r.issues);
  return r;
}

/** Re-evaluate refraction after the user toggles a11y attributes on <html>. */
function refresh(root = document) {
  const on = refractionAllowed();
  document.documentElement.classList.toggle('lg-refract-on', on);
  if (on) root.querySelectorAll('.lg-glass[data-lg-refract-auto]').forEach((el) => refract(el));
}

const LG = { init, refresh, refract, morphIndicator, openMenu, closeMenu, materialize, dematerialize, prefs, audit, supportsRefraction };
if (typeof window !== 'undefined') window.LG = LG;

})();

<script>
(function(){
/*
 * Liquid Glass Lab — WebGL2 refraction engine (v2).
 *
 * A physically INSPIRED UI material model. It is not Apple's renderer and makes no claim to match it.
 *
 * Per pixel inside a glass shape:
 *   1. Signed distance to the shape boundary (analytic for rect / rounded rect / circle / ellipse / capsule,
 *      CPU-built distance-field texture for SVG paths and polygons).
 *   2. A convex bevel height profile of width `curvature × min(halfWidth, halfHeight)` and height `thickness`.
 *      Surface normal = gradient of that height field (smooth across rounded corners).
 *   3. Snell refraction of the view ray with index `ior`; the ray travels `thickness` to the backdrop plane.
 *      The resulting offset (× `refraction`) shifts the BACKDROP texture lookup — the real backdrop pixels move.
 *   4. Optional frosted blur (12-tap disk), dispersion, Schlick Fresnel reflection, light-facing rim highlight,
 *      subtle internal reflection, tint, drop shadow, 1-device-pixel antialiased edge.
 * No noise or turbulence is used anywhere.
 *
 * Limitation: WebGL cannot read DOM pixels. The backdrop must be drawable: <canvas>, <img> or <video>.
 * For DOM backdrops use the v1 SVG path (liquid-glass.js → LG.refract) or blur. See attach() `backdrop`.
 *
 * API
 *   const engine = LGRefraction.engine();            // shared singleton, or null if WebGL2 unavailable
 *   const glass  = LGRefraction.attach(el, {
 *     backdrop: canvasOrImgOrVideo,                    // required for WebGL
 *     dynamic: true,                                   // re-upload backdrop every frame (video / animated canvas)
 *     shape: { type: 'roundedRect', radius: 24 }      // 'rect' | 'roundedRect' | 'circle' | 'ellipse' | 'capsule'
 *          | { type: 'path', d: 'M…', viewBox: [0,0,100,100] } | { type: 'polygon', points: [[x,y],…] } (0..1),
 *     material: { ior, thickness, curvature, refraction, edge, fresnel, blur, tint, reflection, dispersion, shadow },
 *   });
 *   glass.update({ material: { ior: 1.6 } }); glass.destroy();
 *   LGRefraction.disableAll() / enableAll()           // runtime rollback to v1
 */

/**
 * SIGNATURE — the user's chosen sweet spot (Refraction Test Lab, v2 tuned 2026-11-18; v1 was 2026-11-17).
 * This is the default for every shape and every component. Change it only when the user asks.
 */
const SIGNATURE = Object.freeze({
  profile: 'rim',    // 'rim' (signature look) | 'physical' (Snell through a circular bevel)
  ior: 1.51,         // effective refractive index
  thickness: 31,     // CSS px. rim: peak pull at the edge = thickness·(ior−1)·2·refraction ≈ 32 px
  curvature: 0.25,   // bend band width as a fraction of the shorter half-size (narrow rim)
  refraction: 1,     // global multiplier on the offset
  edge: 0.81,        // rim highlight intensity
  fresnel: 0.92,     // Fresnel reflection weight
  blur: 2.5,         // CSS px frosted blur AFTER bending
  tint: 'rgba(255,255,255,0.11)',
  reflection: 0.41,  // internal reflection weight
  dispersion: 0.015, // chromatic split
  shadow: 0.25,      // drop shadow opacity
  lightAngle: 50,    // degrees; direction light comes FROM (50 = lower right)

});

/**
 * Presets keep the signature BEND (profile, ior, thickness, curvature) and only change legibility layers,
 * so every surface in a UI reads as the same glass.
 */
const PRESETS = Object.freeze({
  signature: SIGNATURE,
  control: Object.freeze({ ...SIGNATURE, tint: 'rgba(255,255,255,0.16)' }),               // buttons, toolbars, tab bars with icons/labels
  media: Object.freeze({ ...SIGNATURE, tint: 'rgba(0,0,0,0.28)' }),                        // controls over photos/video (HIG dimming idea)
  overlay: Object.freeze({ ...SIGNATURE, blur: 8, tint: 'rgba(250,250,252,0.55)' }),       // menus, sheets, panels with body text
  'overlay-dark': Object.freeze({ ...SIGNATURE, blur: 8, tint: 'rgba(28,28,32,0.55)' }),

const SHAPES = { rect: 0, roundedRect: 1, circle: 2, ellipse: 3, capsule: 4, path: 5, polygon: 5, union: 5 };
const PAD = 28; // CSS px around the shape for shadow + antialiasing

// ---------------------------------------------------------------------------------------------------------------
// shaders
// ---------------------------------------------------------------------------------------------------------------
const VERT = `#version 300 es
in vec2 aPos;
out vec2 vUv;
void main(){ vUv = vec2(aPos.x*0.5+0.5, 0.5-aPos.y*0.5); gl_Position = vec4(aPos,0.,1.); }`;

const FRAG = `#version 300 es
precision highp float;
in vec2 vUv;
out vec4 outColor;
uniform vec2 uSize;      // shape box, css px
uniform float uPad;      // css px
uniform float uDpr;
uniform int uShape;
uniform float uRadius;
uniform sampler2D uSdf;  // R = true sdf (css px), G = smoothed sdf for normals
uniform sampler2D uBg;
uniform vec2 uBgUv0;     // backdrop uv of shape box top-left
uniform vec2 uBgUvPx;    // backdrop uv per css px
uniform float uHmin;
uniform float uIor, uThick, uCurv, uStrength, uEdge, uFresnel, uBlur, uReflect, uDisp, uShadow, uMaxOff;
uniform vec4 uTint;
uniform vec2 uLight;     // unit vector the light comes FROM (screen space, y down)
uniform int uDebug;      // 0 final, 1 normals, 2 offset, 3 sdf bands
uniform int uProfile;    // 0 rim lens (default), 1 physical bevel

float sdTrue(vec2 p){
  vec2 h=uSize*0.5;
  if(uShape==0) return sdRoundBox(p,h,0.);
  if(uShape==1) return sdRoundBox(p,h,uRadius);
  if(uShape==2) return length(p)-min(h.x,h.y);
  if(uShape==3) return sdEllipse(p,h);
  if(uShape==4) return sdRoundBox(p,h,min(h.x,h.y));

float sdBevel(vec2 p, float W){
  vec2 h=uSize*0.5;

  if(uShape==5){ vec2 uv=clamp((p+h)/uSize,0.,1.); return texture(uSdf,uv).g + length(max(abs(p)-h,0.)); }
  return sdTrue(p);
}

vec3 bg(vec2 uv){ return texture(uBg,uv).rgb; }
vec3 bgBlur(vec2 uv, float rPx){

  for(int i=0;i<6;i++){
    float a=float(i)*2.39996323; float r=sqrt((float(i)+0.5)/6.)*rPx;
    vec2 o=vec2(cos(a),sin(a))*r;
    acc+=bg(uv+o*uBgUvPx)+bg(uv+vec2(-o.x,o.y)*uBgUvPx); w+=2.;
  }

}

void main(){
  vec2 full=uSize+2.*uPad;
  vec2 p=vUv*full-uPad-uSize*0.5;          // css px from shape centre, y down
  float s=sdTrue(p);
  float aa=clamp(0.5-s*uDpr,0.,1.);       // 1 device-pixel antialiasing
  // drop shadow (outside the shape)
  float sh=0.;

  if(aa<=0.){ outColor=vec4(0.,0.,0.,sh); return; }

  float hmin=uHmin>0.?uHmin:min(uSize.x,uSize.y)*0.5;
  float W=max(2.,uCurv*hmin);
  float e=0.75;
  // depth from the TRUE boundary (continuous: height is 0 exactly at the visible edge);
  // direction from the smoothed bevel field (continuous: no crease at corners / along medial axes)
  float d=-s;

<script>
(function(){
// Refraction Test Lab — compares the v1 SVG renderer, blur-only, and the v2 WebGL2 engine on identical backdrops.
// Deterministic hooks for automated tests live on window.LAB.
const LGRefraction = window.LGRefraction; const { DEFAULT_MATERIAL } = LGRefraction;
const LG = window.LG;

const SHAPES = [
  { id: 'circle', label: 'Circle', w: 150, h: 150, shape: { type: 'circle' }, css: '50%' },
  { id: 'ellipse', label: 'Ellipse', w: 230, h: 140, shape: { type: 'ellipse' }, css: '50%' },
  { id: 'rect', label: 'Rectangle', w: 210, h: 130, shape: { type: 'rect' }, css: '0' },
  { id: 'rounded', label: 'Rounded rect', w: 210, h: 130, shape: { type: 'roundedRect', radius: 30 }, css: '30px' },
  { id: 'capsule', label: 'Capsule', w: 240, h: 84, shape: { type: 'capsule' }, css: '999px' },
  { id: 'path', label: 'SVG path (blob)', w: 200, h: 160,
    shape: { type: 'path', viewBox: [0, 0, 200, 160], d: 'M100 8C150 4 196 40 192 86C188 132 146 156 98 152C50 148 6 126 8 80C10 34 50 12 100 8Z' },
    clip: "path('M100 8C150 4 196 40 192 86C188 132 146 156 98 152C50 148 6 126 8 80C10 34 50 12 100 8Z')" },
  { id: 'polygon', label: 'Polygon (hexagon)', w: 180, h: 160,
    shape: { type: 'polygon', points: [[0.25, 0.03], [0.75, 0.03], [0.99, 0.5], [0.75, 0.97], [0.25, 0.97], [0.01, 0.5]] },
    clip: 'polygon(25% 3%, 75% 3%, 99% 50%, 75% 97%, 25% 97%, 1% 50%)' },
  { id: 'star', label: 'Polygon (star, concave)', w: 180, h: 170,
    shape: { type: 'polygon', points: starPoints(5, 0.5, 0.22) }, clip: `polygon(${starPoints(5, 0.5, 0.22).map(([x, y]) => `${(x * 100).toFixed(1)}% ${(y * 100).toFixed(1)}%`).join(',')})` },

function starPoints(n, R, r) {
  const pts = [];
  for (let i = 0; i < n * 2; i++) { const a = -Math.PI / 2 + (i * Math.PI) / n; const rad = i % 2 ? r : R; pts.push([0.5 + Math.cos(a) * rad, 0.52 + Math.sin(a) * rad]); }

const CELL_W = 290, CELL_H = 230, COLS = 4;
const M = 90; // backdrop margin around the grid so edge cells never sample past the texture edge (keeps symmetry)
const state = {
  bg: 'checker', mode: 'webgl', time: 0, paused: false, debug: 0,
  material: { ...DEFAULT_MATERIAL },
  photo: null,
};
const grids = [];

// ---------------------------------------------------------------- backdrops (drawn per cell → identical per shape)
function drawCell(ctx, kind, w, h, t) {

      if (((i + j) % 2 + 2) % 2 === 0) ctx.fillRect(x0 + i * s, y0 + j * s, s, s);
    if (kind === 'moving') {
      ctx.fillStyle = '#ff2d55'; ctx.beginPath(); ctx.arc(cx + Math.cos(t * 1.3) * w * 0.32, cy + Math.sin(t * 1.7) * h * 0.3, 26, 0, 7); ctx.fill();
      ctx.fillStyle = '#0a84ff'; ctx.font = '700 28px system-ui,sans-serif'; ctx.fillText('MOVING', ((t * 60) % (w + 160)) - 140, h * 0.32);
    }

    ctx.fillStyle = '#fff'; ctx.fillRect(-M, -M, w + 2 * M, h + 2 * M); ctx.fillStyle = '#000';

  } else if (kind === 'gradient') {
    const g = ctx.createLinearGradient(0, -M, 0, h + M);                                         // vertical: left/right symmetric
    ['#ff375f', '#ff9f0a', '#ffd60a', '#30d158', '#64d2ff', '#5e5ce6', '#bf5af2'].forEach((c, i, a) => g.addColorStop(i / (a.length - 1), c));

// ---------------------------------------------------------------- grid of shapes
function makeGrid(host, renderer, title) {
  const wrap = document.createElement('section'); wrap.className = 'grid-wrap';

    const cx = M + (i % COLS) * CELL_W, cy = M + Math.floor(i / COLS) * CELL_H, col = i % COLS, row = Math.floor(i / COLS);
    const label = document.createElement('div'); label.className = 'cell-label'; label.textContent = s.label;
    label.style.left = `${cx + 8}px`; label.style.top = `${cy + 6}px`;
    const el = document.createElement('div');

    el.innerHTML = '<span>Aa</span>';

}

    } else if (g.renderer === 'svg') {
      el.classList.add('lg-glass', 'old-v1');

    }

}

function drawGrid(g) {
  const ctx = g.canvas.getContext('2d');
  ctx.setTransform(g.dpr, 0, 0, g.dpr, 0, 0);
  for (const it of g.items) {
    // edge cells also paint the outer margin so the backdrop continues past the grid
    const x0 = it.cx - (it.col === 0 ? M : 0), y0 = it.cy - (it.row === 0 ? M : 0);
    const x1 = it.cx + CELL_W + (it.col === COLS - 1 || it === g.items[g.items.length - 1] ? M : 0), y1 = it.cy + CELL_H + (it.row === it.rows - 1 ? M : 0);
    ctx.save(); ctx.beginPath(); ctx.rect(x0, y0, x1 - x0, y1 - y0); ctx.clip(); ctx.translate(it.cx, it.cy);

function redraw() { grids.forEach(drawGrid); LGRefraction.renderNow(); }

// animation: draw backdrop, then render glass synchronously in the same frame (acceptance E)
let last = performance.now();
function tick(now) {
  const dt = (now - last) / 1000; last = now;
  if (state.bg === 'moving' && !state.paused) { state.time += dt; redraw(); }
  requestAnimationFrame(tick);
}

// ---------------------------------------------------------------- controls
const CONTROLS = [
  ['refraction', 'Refraction strength', 0, 2, 0.01],
  ['ior', 'Refractive index', 1.0, 2.4, 0.01],
  ['thickness', 'Glass thickness (px)', 0, 120, 1],
  ['curvature', 'Curvature (bevel width)', 0.05, 1, 0.01],
  ['edge', 'Edge intensity', 0, 1.5, 0.01],
  ['fresnel', 'Fresnel strength', 0, 1, 0.01],
  ['blur', 'Background blur (px)', 0, 20, 0.5],
  ['reflection', 'Reflection strength', 0, 1, 0.01],
  ['dispersion', 'Dispersion', 0, 0.2, 0.005],
  ['shadow', 'Shadow', 0, 1, 0.01],
  ['maxOffset', 'Max bend clamp (× half-size)', 0.1, 2, 0.05],
  ['lightAngle', 'Light angle (deg)', -180, 180, 1],

function buildControls() {
  const box = document.getElementById('controls');
  for (const [k, label, min, max, step] of CONTROLS) {
    const row = document.createElement('label'); row.className = 'ctl';
    row.innerHTML = `<span>${label}</span><input type="range" min="${min}" max="${max}" step="${step}" value="${state.material[k]}" data-k="${k}"><output>${state.material[k]}</output>`;
    const inp = row.querySelector('input'), out = row.querySelector('output');
    inp.addEventListener('input', () => { setParams({ [k]: +inp.value }); out.textContent = inp.value; });
    box.append(row);
  }
  const tint = document.createElement('label'); tint.className = 'ctl';
  tint.innerHTML = '<span>Tint colour / amount</span><span class="tintrow"><input type="color" value="#ffffff" id="tint-c"><input type="range" min="0" max="0.6" step="0.01" value="0.06" id="tint-a"></span><output id="tint-o">0.06</output>';
  box.append(tint);
  const upd = () => { const c = document.getElementById('tint-c').value, a = +document.getElementById('tint-a').value; document.getElementById('tint-o').textContent = a; const n = parseInt(c.slice(1), 16); setParams({ tint: `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})` }); };
  tint.querySelectorAll('input').forEach((i) => i.addEventListener('input', upd));
  document.getElementById('bg').addEventListener('change', (e) => setBackground(e.target.value));
  document.getElementById('mode').addEventListener('change', (e) => setMode(e.target.value));
  document.getElementById('debug').addEventListener('change', (e) => setDebug(+e.target.value));
  document.getElementById('pause').addEventListener('change', (e) => { state.paused = e.target.checked; });
  const syncInputs = () => { document.querySelectorAll('#controls input[type=range][data-k]').forEach((i) => { i.value = state.material[i.dataset.k]; i.nextElementSibling.textContent = i.value; }); document.getElementById('profile').value = state.material.profile; };

  document.getElementById('profile').addEventListener('change', (e) => setParams({ profile: e.target.value }));

    try { await navigator.clipboard.writeText(txt); msg.textContent = 'Copied. Paste it to Claude.'; }
    catch { msg.textContent = 'Clipboard blocked — select the text below and copy it.'; }

  document.getElementById('photo-file').addEventListener('change', (e) => {
    const f = e.target.files[0]; if (!f) return;
    const im = new Image(); im.onload = () => { state.photo = im; setBackground('photo'); document.getElementById('bg').value = 'photo'; }; im.src = URL.createObjectURL(f);
  });
}

function showSettings() {
  const pre = document.getElementById('settings-json'); if (pre) pre.textContent = JSON.stringify(state.material, null, 2);
}
function setParams(p) {
  Object.assign(state.material, p);
  showSettings();
  grids.forEach((g) => g.items.forEach((it) => it.handle && it.handle.update && it.handle.update({ material: p })));
  LGRefraction.renderNow();
}
function setDebug(d) { state.debug = d; grids.forEach((g) => g.items.forEach((it) => it.handle && it.handle.update && it.handle.update({ debug: d }))); LGRefraction.renderNow(); }
function setBackground(b) { state.bg = b; const sel = document.getElementById('bg'); if (sel && sel.value !== b) sel.value = b; redraw(); }
function setMode(mode) {
  state.mode = mode;
  const sel = document.getElementById('mode'); if (sel && sel.value !== mode) sel.value = mode;
  const host = document.getElementById('grids');
  grids.splice(0).forEach((g) => { g.items.forEach((it) => it.handle && it.handle.destroy && it.handle.destroy()); g.wrap.remove(); });
  if (mode === 'compare') { makeGrid(host, 'svg', 'Old renderer — v1 SVG backdrop-filter (Chromium)'); makeGrid(host, 'webgl', 'New renderer — v2 WebGL2 SDF refraction'); }
  else if (mode === 'compare-blur') { makeGrid(host, 'blur', 'Ordinary backdrop blur only'); makeGrid(host, 'webgl', 'New renderer — v2 WebGL2 SDF refraction'); }
  else makeGrid(host, mode, { webgl: 'New renderer — v2 WebGL2 SDF refraction', svg: 'Old renderer — v1 SVG backdrop-filter', blur: 'Ordinary backdrop blur only' }[mode]);

  updateStatus();
}
function setTime(t) { state.time = t; state.paused = true; const p = document.getElementById('pause'); if (p) p.checked = true; redraw(); }

function updateStatus() {
  const s = LGRefraction.stats();
  document.getElementById('status').textContent = s
    ? `WebGL2: yes · ${s.renderer} · ${s.instances} instances · render ${s.avgMs.toFixed(2)} ms/frame (CPU-side, includes upload + copy)`
    : `WebGL2: NO (${LGRefraction.supportInfo.reason}) — showing fallback renderer`;
}

async function init() {
  LG.init();
  const im = new Image(); im.src = document.getElementById('photo-src').getAttribute('href');
  await im.decode().catch(() => {}); state.photo = im;
  buildControls();
  const qs = new URLSearchParams(location.search);
  if (qs.get('bg')) { state.bg = qs.get('bg'); document.getElementById('bg').value = state.bg; }
  const mode = qs.get('mode') || 'webgl'; document.getElementById('mode').value = mode;
  setMode(mode);
  setInterval(updateStatus, 1000);
  requestAnimationFrame(tick);
}

window.LAB = { setParams, setBackground, setMode, setTime, setDebug, state, grids, shapes: SHAPES, redraw, CELL_W, CELL_H, COLS };
window.__LAB_READY__ = init().then(() => true);

})();
