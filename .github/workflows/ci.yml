name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Build tokens + bundles
        run: npm run build
      - name: Install test deps
        run: cd validation && npm ci
      - name: Refraction engine tests (headless Chrome)
        run: npm run test:refraction
      - name: Web demo tests
        run: npm run test:web
      - name: Glass API tests
        run: npm run test:glass
      - name: React typecheck, build, smoke
        run: npm run test:react
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: screenshots, path: validation/screenshots }
